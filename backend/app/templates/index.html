<!doctype html>
<html>
  <head>
    <title>AI Medical Claim Processing System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        background: #0f172a;
        color: white;
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #38bdf8;
      }

      .card {
        background: #1e293b;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: none;
        font-size: 14px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #38bdf8;
        border: none;
        color: black;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
      }

      button:hover {
        background: #0ea5e9;
      }

      .result {
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }

      .approved {
        background: #064e3b;
      }
      .rejected {
        background: #7f1d1d;
      }
      .manual {
        background: #78350f;
      }

      .fraud-low {
        color: #4ade80;
        font-weight: bold;
      }
      .fraud-medium {
        color: orange;
        font-weight: bold;
      }
      .fraud-high {
        color: #f87171;
        font-weight: bold;
      }

      .confidence-bar {
        height: 12px;
        background: #334155;
        border-radius: 6px;
        margin-top: 8px;
      }

      .confidence-fill {
        height: 12px;
        border-radius: 6px;
        background: #38bdf8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏥 AI Medical Claim Processing System</h1>

      <div class="card">
        <h3>Claim Details</h3>

        <form id="claimForm">
          <input type="number" name="user_id" placeholder="User ID" required />
          <input
            type="number"
            name="patient_age"
            placeholder="Patient Age"
            required
          />

          <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>

          <input
            type="text"
            name="diagnosis_code"
            placeholder="Diagnosis Code"
            required
          />
          <input
            type="text"
            name="procedure_code"
            placeholder="Procedure Code"
            required
          />

          <input
            type="number"
            name="claim_amount"
            placeholder="Claim Amount"
            required
          />
          <input
            type="number"
            name="policy_coverage_amount"
            placeholder="Policy Coverage Amount"
            required
          />

          <select name="hospital_type">
            <option value="Private">Private</option>
            <option value="Government">Government</option>
          </select>

          <select name="admission_type">
            <option value="Emergency">Emergency</option>
            <option value="Planned">Planned</option>
          </select>

          <input
            type="number"
            name="previous_claim_count"
            placeholder="Previous Claim Count"
            required
          />

          <button type="submit">🚀 Evaluate Claim</button>
        </form>
      </div>

      <div id="result"></div>
    </div>

    <script>
      document.getElementById("claimForm").onsubmit = async function (e) {
        e.preventDefault();

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const resultDiv = document.getElementById("result");

        if (response.status === 200) {
          const result = await response.json();

          let statusClass = "manual";
          if (result.claim_status === "Approved") statusClass = "approved";
          if (result.claim_status === "Rejected") statusClass = "rejected";

          let fraudClass = "fraud-low";
          if (result.fraud_risk === "Medium") fraudClass = "fraud-medium";
          if (result.fraud_risk === "High") fraudClass = "fraud-high";

          resultDiv.innerHTML = `
            <div class="card result ${statusClass}">
                <h2>Prediction Result</h2>
                <p><strong>Status:</strong> ${result.claim_status}</p>
                <p><strong>Fraud Risk:</strong> 
                    <span class="${fraudClass}">${result.fraud_risk}</span>
                </p>
                <p><strong>Explanation:</strong> ${result.explanation}</p>
                <p><strong>Confidence:</strong> ${(result.confidence_score * 100).toFixed(2)}%</p>

                <div class="confidence-bar">
                    <div class="confidence-fill" 
                         style="width:${result.confidence_score * 100}%">
                    </div>
                </div>
            </div>
        `;
        } else {
          resultDiv.innerHTML = `
            <div class="card rejected">
                <h3>Error</h3>
                <p>Insufficient data to evaluate this claim.</p>
            </div>
        `;
        }
      };
    </script>
  </body>
</html>
