<!doctype html>
<html>
  <head>
    <title>AI Medical Claim Intelligence Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0b1120;
        color: #e2e8f0;
      }

      .header {
        padding: 30px;
        text-align: center;
        background: #0f172a;
        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #38bdf8;
        margin: 0;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        padding: 30px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }

      .kpi {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }

      .kpi h3 {
        margin: 0;
        font-size: 14px;
        color: #94a3b8;
      }

      .kpi p {
        font-size: 22px;
        margin: 8px 0 0;
      }

      .card {
        background: #111827;
        padding: 25px;
        border-radius: 16px;
        margin-bottom: 30px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      label {
        font-size: 13px;
        color: #94a3b8;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: white;
      }

      button {
        margin-top: 20px;
        padding: 12px;
        width: 100%;
        background: #38bdf8;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #0ea5e9;
      }

      .result-box {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        margin-top: 20px;
      }

      .status-approved {
        color: #22c55e;
      }
      .status-rejected {
        color: #ef4444;
      }
      .status-manual {
        color: #f59e0b;
      }

      .fraud-low {
        color: #22c55e;
      }
      .fraud-medium {
        color: #f59e0b;
      }
      .fraud-high {
        color: #ef4444;
      }

      .progress {
        height: 8px;
        background: #334155;
        border-radius: 6px;
        margin-top: 10px;
      }

      .progress-bar {
        height: 8px;
        background: #38bdf8;
        border-radius: 6px;
      }

      table {
        width: 100%;
        margin-top: 15px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #334155;
      }

      @media (max-width: 900px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .kpi-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>🏥 AI Medical Claim Intelligence Platform</h1>
      <p>Automated Claim Validation • Fraud Detection • Explainable AI</p>
    </div>

    <div class="container">
      <!-- KPI SECTION -->
      <div class="kpi-grid">
        <div class="kpi">
          <h3>Total Claims</h3>
          <p id="totalClaims">--</p>
        </div>
        <div class="kpi">
          <h3>Approved</h3>
          <p id="approvedCount">--</p>
        </div>
        <div class="kpi">
          <h3>Rejected</h3>
          <p id="rejectedCount">--</p>
        </div>
        <div class="kpi">
          <h3>Manual Review</h3>
          <p id="manualCount">--</p>
        </div>
      </div>

      <!-- CLAIM FORM -->
      <div class="card">
        <h2>Submit Medical Claim</h2>

        <form id="claimForm">
          <div class="form-grid">
            <div>
              <label>User ID</label>
              <input type="number" name="user_id" required />
            </div>

            <div>
              <label>Patient Age</label>
              <input type="number" name="patient_age" required />
            </div>

            <div>
              <label>Gender</label>
              <select name="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>

            <div>
              <label>Hospital Type</label>
              <select name="hospital_type">
                <option>Private</option>
                <option>Government</option>
                <option>Corporate</option>
              </select>
            </div>

            <div>
              <label>Diagnosis Code</label>
              <input name="diagnosis_code" required />
            </div>

            <div>
              <label>Procedure Code</label>
              <input name="procedure_code" required />
            </div>

            <div>
              <label>Claim Amount</label>
              <input type="number" name="claim_amount" required />
            </div>

            <div>
              <label>Policy Coverage Amount</label>
              <input type="number" name="policy_coverage_amount" required />
            </div>

            <div>
              <label>Admission Type</label>
              <select name="admission_type">
                <option>Emergency</option>
                <option>Planned</option>
                <option>Accident</option>
              </select>
            </div>

            <div>
              <label>Previous Claim Count</label>
              <input type="number" name="previous_claim_count" required />
            </div>
          </div>

          <button>Evaluate Claim</button>
        </form>

        <div id="result"></div>
      </div>

      <!-- CLAIM HISTORY -->
      <div class="card">
        <h2>Claim History</h2>
        <button onclick="loadHistory()">Load User History</button>
        <table id="historyTable"></table>
      </div>

      <!-- ADMIN ANALYTICS -->
      <div class="card">
        <h2>Admin Analytics</h2>
        <input id="adminId" placeholder="Admin User ID" />
        <button onclick="loadAdmin()">Load Analytics</button>
        <canvas id="chart"></canvas>
      </div>
    </div>

    <script>
      document.getElementById("claimForm").onsubmit = async function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());

        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (res.status !== 200) {
          document.getElementById("result").innerHTML =
            `<div class="result-box">
        Insufficient data to evaluate this claim.
        </div>`;
          return;
        }

        const result = await res.json();

        let statusClass = "status-manual";
        if (result.claim_status === "Approved") statusClass = "status-approved";
        if (result.claim_status === "Rejected") statusClass = "status-rejected";

        let fraudClass = "fraud-low";
        if (result.fraud_risk === "Medium") fraudClass = "fraud-medium";
        if (result.fraud_risk === "High") fraudClass = "fraud-high";

        document.getElementById("result").innerHTML = `<div class="result-box">
    <h3 class="${statusClass}">Status: ${result.claim_status}</h3>
    <p>Fraud Risk: <span class="${fraudClass}">${result.fraud_risk}</span></p>
    <p><strong>Explanation:</strong> ${result.explanation}</p>
    <p>Confidence: ${(result.confidence_score * 100).toFixed(2)}%</p>
    <div class="progress">
    <div class="progress-bar" style="width:${result.confidence_score * 100}%"></div>
    </div>
    </div>`;
      };

      async function loadHistory() {
        const id = prompt("Enter User ID");
        const res = await fetch(`/history/${id}`);
        const data = await res.json();

        let table = "<tr><th>Status</th><th>Fraud</th><th>Confidence</th></tr>";
        data.forEach((c) => {
          table += `<tr>
        <td>${c.claim_status}</td>
        <td>${c.fraud_risk}</td>
        <td>${c.confidence_score}</td>
        </tr>`;
        });

        document.getElementById("historyTable").innerHTML = table;
      }

      async function loadAdmin() {
        const id = document.getElementById("adminId").value;
        const res = await fetch(`/admin/${id}`);
        const data = await res.json();

        document.getElementById("totalClaims").innerText = data.total_claims;
        document.getElementById("approvedCount").innerText = data.approved;
        document.getElementById("rejectedCount").innerText = data.rejected;
        document.getElementById("manualCount").innerText = data.manual;

        new Chart(document.getElementById("chart"), {
          type: "bar",
          data: {
            labels: ["Approved", "Rejected", "Manual"],
            datasets: [
              {
                label: "Claim Distribution",
                data: [data.approved, data.rejected, data.manual],
              },
            ],
          },
        });
      }
    </script>
  </body>
</html>
