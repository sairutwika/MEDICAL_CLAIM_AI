<!doctype html>
<html>
  <head>
    <title>AI Medical Claim Processing</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #1f2937, #111827);
        padding: 40px;
        color: white;
      }

      .container {
        max-width: 850px;
        background: #1e293b;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        margin: auto;
      }

      h1 {
        text-align: center;
        color: #38bdf8;
      }

      label {
        font-size: 14px;
        margin-top: 10px;
        display: block;
        color: #cbd5e1;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: none;
        background: #334155;
        color: white;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        outline: 2px solid #38bdf8;
      }

      button {
        margin-top: 20px;
        padding: 12px;
        background: linear-gradient(90deg, #2563eb, #38bdf8);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 20px rgba(56, 189, 248, 0.6);
      }

      .result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        display: none;
      }

      .approved {
        background: rgba(34, 197, 94, 0.2);
        border: 1px solid #22c55e;
      }
      .rejected {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid #ef4444;
      }
      .manual {
        background: rgba(249, 115, 22, 0.2);
        border: 1px solid #f97316;
      }

      .low {
        color: #22c55e;
        font-weight: bold;
      }
      .medium {
        color: #f97316;
        font-weight: bold;
      }
      .high {
        color: #ef4444;
        font-weight: bold;
      }

      .progress {
        height: 18px;
        background: #475569;
        border-radius: 10px;
        margin-top: 10px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: #38bdf8;
        text-align: center;
        font-size: 12px;
        line-height: 18px;
        color: black;
        font-weight: bold;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>AI Medical Claim Processing</h1>

      <form id="claimForm">
        <div class="grid">
          <div>
            <label>Patient Age</label>
            <input type="number" id="age" required />
          </div>

          <div>
            <label>Gender</label>
            <select id="gender">
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label>Diagnosis Code</label>
            <select id="diagnosis">
              <option>D123 - General Illness</option>
              <option>D456 - Surgery</option>
              <option>D789 - Cardiac</option>
              <option>D999 - Critical</option>
            </select>
          </div>

          <div>
            <label>Procedure Code</label>
            <select id="procedure">
              <option>P100 - Basic</option>
              <option>P200 - Advanced</option>
              <option>P300 - ICU</option>
            </select>
          </div>

          <div>
            <label>Claim Amount</label>
            <input type="number" id="claim_amount" required />
          </div>

          <div>
            <label>Policy Coverage</label>
            <input type="number" id="policy_coverage" required />
          </div>

          <div>
            <label>Hospital Type</label>
            <select id="hospital">
              <option>Private</option>
              <option>Government</option>
              <option>Specialty</option>
            </select>
          </div>

          <div>
            <label>Admission Type</label>
            <select id="admission">
              <option>Emergency</option>
              <option>Planned</option>
            </select>
          </div>

          <div>
            <label>Previous Claim Count</label>
            <input type="number" id="previous_claim_count" required />
          </div>
        </div>

        <button type="submit">Submit Claim</button>
      </form>

      <div id="result" class="result"></div>
    </div>

    <script>
      document
        .getElementById("claimForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const response = await fetch("/submit-claim", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_age: parseInt(age.value),
              gender: gender.value,
              diagnosis_code: diagnosis.value.split(" ")[0],
              procedure_code: procedure.value.split(" ")[0],
              claim_amount: parseFloat(claim_amount.value),
              policy_coverage: parseFloat(policy_coverage.value),
              hospital_type: hospital.value,
              admission_type: admission.value,
              previous_claim_count: parseInt(previous_claim_count.value),
            }),
          });

          const data = await response.json();

          const statusClass = data.claim_status.toLowerCase();
          const fraudClass = data.fraud_risk.toLowerCase();

          const resultBox = document.getElementById("result");
          resultBox.style.display = "block";
          resultBox.className = "result " + statusClass;

          resultBox.innerHTML = `
        <h3>Status: ${data.claim_status}</h3>
        <p>Fraud Risk: <span class="${fraudClass}">${data.fraud_risk}</span></p>
        <p>Explanation: ${data.explanation}</p>
        <div class="progress">
            <div class="progress-bar" style="width:${data.confidence_score * 100}%">
                ${Math.round(data.confidence_score * 100)}%
            </div>
        </div>
    `;
        });
    </script>
  </body>
</html>
